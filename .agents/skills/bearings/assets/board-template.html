<!-- The first <style> is the fleet-html house stylesheet, copied verbatim from
     arjmad/skills skills/fleet-html/house.css (commit f619a4b, PR 229) so the
     board stays one self-contained file. Refresh it by pasting that file again;
     board rules live only in the second <style> and read only semantic tokens. -->
<style>
/* fleet-html house.css v2 · Dracula, dark only · source: SOURCE.md */
:root {
  /* primitives: every colour the house uses, by hue (Dracula spec, derived shades in SOURCE.md); components never read these */
  --fm-night-950: #282a36;
  --fm-night-900: #343746;
  --fm-night-800: #44475a;
  --fm-comment-500: #6272a4;
  --fm-comment-300: #8b96c8;
  --fm-comment-200: #b0b8d8;
  --fm-fg-50: #f8f8f2;
  --fm-fg-100: #e2e2dc;
  --fm-purple-300: #bd93f9;
  --fm-purple-950: #3b3352;
  --fm-green-300: #50fa7b;
  --fm-green-950: #2a3d34;
  --fm-yellow-200: #f1fa8c;
  --fm-yellow-950: #3b3d2e;
  --fm-cyan-200: #8be9fd;
  --fm-cyan-950: #263f48;
  --fm-orange-300: #ffb86c;
  --fm-pink-300: #ff79c6;
  --fm-red-400: #ff5555;
  --fm-blue-400: #3d8bff;

  /* semantic: what components read; the contrast contract checks these */
  --fm-bg: var(--fm-night-950);
  --fm-card: var(--fm-night-900);
  --fm-raised: var(--fm-night-800);
  --fm-ink: var(--fm-fg-50);
  --fm-text: var(--fm-fg-100);
  --fm-muted: var(--fm-comment-200);
  --fm-rule: var(--fm-comment-500);
  --fm-edge: var(--fm-comment-300);
  --fm-accent: var(--fm-purple-300);
  --fm-accent-soft: var(--fm-purple-950);
  --fm-on-accent: var(--fm-night-950);
  --fm-ok: var(--fm-green-300);
  --fm-ok-soft: var(--fm-green-950);
  --fm-warn: var(--fm-yellow-200);
  --fm-warn-soft: var(--fm-yellow-950);
  --fm-info: var(--fm-cyan-200);
  --fm-info-soft: var(--fm-cyan-950);
  --fm-link: var(--fm-cyan-200);
  --fm-focus: var(--fm-fg-50);
  --fm-shadow-soft: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);

  /* chart series, in this order; checked for contrast and colour-blind separation */
  --fm-chart-1: var(--fm-purple-300);
  --fm-chart-2: var(--fm-cyan-200);
  --fm-chart-3: var(--fm-orange-300);
  --fm-chart-4: var(--fm-pink-300);
  --fm-chart-5: var(--fm-yellow-200);
  --fm-chart-6: var(--fm-red-400);
  --fm-chart-7: var(--fm-blue-400);

  --fm-font-sans: "Jost", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --fm-font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fm-gutter: max(16px, env(safe-area-inset-left, 0px));
  --fm-gutter-end: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}

/* base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--fm-bg); }
body { margin: 0; background: var(--fm-bg); color: var(--fm-text); font-family: var(--fm-font-sans); font-size: 1rem; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, dl, dd, figure, pre { margin: 0; }
h1, h2, h3 { color: var(--fm-ink); text-wrap: balance; }
p, li, dd, td, th, figcaption { overflow-wrap: anywhere; }
p { max-width: 68ch; }
a { color: var(--fm-link); text-underline-offset: .18em; }
code, pre { font-family: var(--fm-font-mono); font-size: max(.75rem, .875em); }
code { overflow-wrap: anywhere; }
pre { overflow-x: auto; max-width: 100%; padding: 12px 14px; background: var(--fm-card); border-radius: 8px; color: var(--fm-text); }
img, svg, video, canvas { max-width: 100%; height: auto; }
::selection { background: var(--fm-accent); color: var(--fm-on-accent); }
:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible { outline: 3px solid var(--fm-focus); outline-offset: 2px; }

/* page: one reading column, phone gutters, nothing wider than the screen */
.fm-page { max-width: 720px; margin-inline: auto; padding-block: 32px 56px; padding-left: var(--fm-gutter); padding-right: var(--fm-gutter-end); display: flex; flex-direction: column; gap: 32px; }
.fm-page > *, .fm-decision > *, .fm-section > *, .fm-form > * { min-width: 0; }
.fm-mast { display: flex; flex-direction: column; gap: 8px; }
.fm-title { font-size: 1.75rem; font-weight: 500; line-height: 1.15; letter-spacing: -.015em; }
.fm-sub { color: var(--fm-muted); font-size: 1rem; max-width: 48ch; }
.fm-mast--compact .fm-title { font-size: 1.375rem; font-weight: 600; letter-spacing: -.01em; }
.fm-meta { font-size: .8125rem; color: var(--fm-muted); overflow-wrap: anywhere; }

/* stat strip: figures only when the numbers are the point */
.fm-stats { display: flex; flex-wrap: wrap; gap: 18px 28px; }
.fm-stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fm-stat__num { font-family: var(--fm-font-mono); font-variant-numeric: tabular-nums; font-size: 1.75rem; font-weight: 400; line-height: 1; letter-spacing: -.01em; color: var(--fm-ink); }
.fm-stat__label { font-size: .8125rem; color: var(--fm-muted); }
.fm-stat--call .fm-stat__num { color: var(--fm-accent); }

/* badge: plain accent label, or a tinted pill per state */
.fm-badge { display: inline-flex; align-items: center; font-size: .8125rem; font-weight: 600; line-height: 1.3; color: var(--fm-accent); }
.fm-badge--ok, .fm-badge--warn, .fm-badge--info, .fm-badge--accent { border: 1px solid currentColor; border-radius: 999px; padding: 2px 10px; }
.fm-badge--ok { color: var(--fm-ok); background: var(--fm-ok-soft); }
.fm-badge--warn { color: var(--fm-warn); background: var(--fm-warn-soft); }
.fm-badge--info { color: var(--fm-info); background: var(--fm-info-soft); }
.fm-badge--accent { color: var(--fm-accent); background: var(--fm-accent-soft); }

/* decision card: the one boxed thing on a page */
.fm-decision { background: var(--fm-card); border-radius: 14px; box-shadow: var(--fm-shadow-soft); padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.fm-decision__top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; }
.fm-decision__title { font-size: 1.375rem; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
.fm-ctx { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.fm-ctx dt { font-size: .8125rem; font-weight: 600; color: var(--fm-ink); padding-top: 8px; }
.fm-ctx dt:first-of-type { padding-top: 0; }
.fm-ctx dd { color: var(--fm-text); }
.fm-form { display: flex; flex-direction: column; gap: 18px; }

/* option: native radio rows split by a hairline; the checked label turns accent */
.fm-opts { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; }
.fm-opts__legend { font-size: .9375rem; font-weight: 600; color: var(--fm-ink); padding: 0; margin-bottom: 4px; }
.fm-opt { display: flex; align-items: flex-start; gap: 14px; min-height: 44px; padding: 12px 0; border-top: 1px solid var(--fm-rule); cursor: pointer; }
.fm-opt:first-of-type { border-top: 0; }
.fm-opt input { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--fm-accent); }
.fm-opt__body { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
.fm-opt__head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.fm-opt__label { font-size: 1.0625rem; font-weight: 500; line-height: 1.3; color: var(--fm-ink); }
.fm-opt:has(input:checked) .fm-opt__label { color: var(--fm-accent); font-weight: 600; }
.fm-opt__hint { font-size: .9375rem; line-height: 1.4; color: var(--fm-muted); }
.fm-rec { flex: none; font-size: .75rem; font-weight: 600; color: var(--fm-accent); border: 1px solid var(--fm-accent); border-radius: 999px; padding: 2px 9px; }

/* field and buttons */
.fm-field { display: flex; flex-direction: column; gap: 6px; }
.fm-field__label { font-size: .9375rem; font-weight: 600; color: var(--fm-ink); }
.fm-input { width: 100%; min-height: 44px; font: inherit; color: var(--fm-ink); background: var(--fm-card); border: 1px solid var(--fm-edge); border-radius: 8px; padding: 8px 12px; }
textarea.fm-input { min-height: 88px; resize: vertical; }
.fm-input::placeholder { color: var(--fm-muted); opacity: 1; }
.fm-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.fm-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 0 18px; font: inherit; font-weight: 600; border-radius: 8px; border: 1px solid var(--fm-edge); background: transparent; color: var(--fm-ink); cursor: pointer; transition: filter .15s ease, background-color .15s ease; }
.fm-btn:hover { background: var(--fm-raised); }
.fm-btn--primary { background: var(--fm-accent); color: var(--fm-on-accent); border-color: var(--fm-accent); }
.fm-btn--primary:hover { background: var(--fm-accent); filter: brightness(1.08); }
.fm-queued { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; font-size: .8125rem; font-weight: 600; color: var(--fm-ok); background: var(--fm-ok-soft); border: 1px solid var(--fm-ok); border-radius: 999px; }
.fm-queued[hidden] { display: none; }
.fm-ico { width: 1em; height: 1em; flex: none; }

/* report sections, table, today-vs-proposed pair, sources */
.fm-section { display: flex; flex-direction: column; gap: 16px; }
.fm-section h2 { font-size: 1.375rem; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
.fm-section h3 { font-size: 1.125rem; font-weight: 600; line-height: 1.3; }
.fm-section p, .fm-section li { font-size: 1.0625rem; line-height: 1.55; }
.fm-section ul, .fm-section ol { padding-left: 1.25rem; display: flex; flex-direction: column; gap: 6px; max-width: 68ch; }
.fm-figure { display: flex; flex-direction: column; gap: 8px; }
.fm-figure figcaption { font-size: .8125rem; color: var(--fm-muted); }
.fm-tablewrap { overflow-x: auto; max-width: 100%; }
.fm-table { border-collapse: collapse; width: 100%; font-size: .9375rem; font-variant-numeric: tabular-nums; }
.fm-table caption { text-align: left; font-size: .8125rem; color: var(--fm-muted); padding-bottom: 6px; }
.fm-table th, .fm-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--fm-rule); vertical-align: top; }
.fm-table th:first-child, .fm-table td:first-child { padding-left: 0; }
.fm-table thead th { font-size: .8125rem; font-weight: 600; color: var(--fm-muted); }
.fm-table tbody th { font-weight: 500; color: var(--fm-ink); }
.fm-table .num { text-align: right; }
.fm-table td.num { font-family: var(--fm-font-mono); }
.fm-compare { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.fm-compare > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fm-compare__k { font-size: .8125rem; font-weight: 600; color: var(--fm-muted); }
.fm-compare__next .fm-compare__k { color: var(--fm-ok); }
.fm-sources { border-top: 1px solid var(--fm-rule); }
.fm-sources summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--fm-ink); }
.fm-sources ul { margin: 6px 0 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; max-width: 68ch; font-size: .9375rem; color: var(--fm-muted); }
.fm-foot { padding-top: 8px; }

/* one column under 720px; pairs sit side by side above it */
@media (min-width: 720px) {
  .fm-compare { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* paper: dark ink on white, controls hidden */
@media print {
  :root {
    --fm-bg: #ffffff;
    --fm-card: #ffffff;
    --fm-raised: #ffffff;
    --fm-ink: #000000;
    --fm-text: #1a1a1a;
    --fm-muted: #474747;
    --fm-rule: #bdbdbd;
    --fm-edge: #6b6b6b;
    --fm-accent: #5b2a9e;
    --fm-accent-soft: #ffffff;
    --fm-on-accent: #ffffff;
    --fm-ok: #1f4a36;
    --fm-ok-soft: #ffffff;
    --fm-warn: #5c3d0c;
    --fm-warn-soft: #ffffff;
    --fm-info: #1d4560;
    --fm-info-soft: #ffffff;
    --fm-link: #1d4560;
    --fm-focus: #000000;
    --fm-shadow-soft: none;
    --fm-chart-1: #a93a1f;
    --fm-chart-2: #0072b2;
    --fm-chart-3: #004d99;
    --fm-chart-4: #a6487b;
    --fm-chart-5: #2f6b4f;
    --fm-chart-6: #6a4fd0;
    --fm-chart-7: #1a2238;
    color-scheme: light;
  }
  .fm-btn, .fm-queued, .fm-field, .fm-actions { display: none !important; }
  .fm-decision, .fm-section, .fm-table tr { break-inside: avoid; }
  .fm-decision { border: 1px solid var(--fm-rule); }
}
</style>
<style>
/* Bearings board rules (bb-*), on the house tokens above. One reading column,
   inbox first; every section is a <details> that remembers its fold per viewer. */
.bb-main { max-width: 760px; gap: 40px; }
.bb-h2 { display: flex; align-items: baseline; gap: 10px; font-size: 1.375rem; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; margin-bottom: 8px; }
.bb-count { font-family: var(--fm-font-mono); font-size: .9375rem; font-weight: 500; color: var(--fm-muted); }
.bb-block { display: flex; flex-direction: column; }
.bb-list { list-style: none; margin: 0; padding: 0; }

/* folding sections: the summary is the whole heading row */
.bb-sec { border-top: 1px solid var(--fm-rule); }
.bb-sec > summary { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 0; cursor: pointer; list-style: none; }
.bb-sec > summary::-webkit-details-marker { display: none; }
.bb-sec__t { font-size: .8125rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fm-accent); }
.bb-sec__n { font-family: var(--fm-font-mono); font-size: .8125rem; color: var(--fm-muted); overflow-wrap: anywhere; }
.bb-sec__cw { display: flex; flex: none; margin-left: auto; }
.bb-sec__chev { flex: none; width: 22px; height: 22px; color: var(--fm-muted); transform: rotate(-90deg); transition: transform .15s ease; }
.bb-sec[open] > summary .bb-sec__chev { transform: none; }
.bb-sec > summary:hover .bb-sec__chev { color: var(--fm-ink); }
.bb-sec__b { padding-bottom: 16px; }
.bb-sec--sub { border-top-color: var(--fm-raised); }
.bb-sec--sub > summary { min-height: 44px; }
.bb-sec--sub .bb-sec__t { text-transform: none; letter-spacing: 0; font-size: .9375rem; color: var(--fm-ink); }

/* one inbox item: title, ask, meta, its own actions, the note row */
.bb-item { display: flex; flex-direction: column; gap: 2px; padding: 14px 0 16px; border-top: 1px solid var(--fm-raised); }
.bb-item:first-child { border-top: 0; padding-top: 6px; }
.bb-item h4, .bb-item p { margin: 0; }
.bb-item__title { font-size: 1.0625rem; font-weight: 600; line-height: 1.3; color: var(--fm-ink); }
.bb-item__ask { font-size: .9375rem; line-height: 1.45; color: var(--fm-text); }
.bb-item__meta a { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; margin-block: -12px; font-weight: 600; color: var(--fm-link); }
.bb-acts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 10px; }
.bb-act { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 44px; padding: 10px 14px; text-align: left; font: inherit; color: var(--fm-ink); background: transparent; border: 1px solid var(--fm-edge); border-radius: 10px; cursor: pointer; transition: background-color .15s ease; }
.bb-act:hover { background: var(--fm-raised); }
.bb-act--main { border-color: var(--fm-accent); }
.bb-act__l { font-size: 1rem; font-weight: 600; line-height: 1.3; }
.bb-act--main .bb-act__l { color: var(--fm-accent); }
.bb-act__h { font-size: .8125rem; line-height: 1.4; color: var(--fm-muted); }
.bb-actgrp { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px; border-radius: 12px; background: var(--fm-card); }
.bb-actgrp--wide { grid-column: 1 / -1; }
.bb-fields { display: flex; flex-wrap: wrap; gap: 8px; }
.bb-fields--counts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.bb-f { display: flex; flex-direction: column; gap: 4px; flex: 1 1 220px; min-width: 0; }
.bb-f__k { font-size: .8125rem; font-weight: 600; color: var(--fm-muted); }
.bb-fields--counts .bb-f__k { text-align: center; font-family: var(--fm-font-mono); }
.bb-fields--counts .fm-input { text-align: center; font-family: var(--fm-font-mono); padding: 8px 4px; }
.bb-f.is-need .fm-input { border-color: var(--fm-warn); box-shadow: 0 0 0 1px var(--fm-warn); }
.bb-noterow { display: flex; gap: 8px; margin-top: 8px; }
.bb-note { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1px solid var(--fm-edge); border-radius: 8px; background: var(--fm-card); cursor: text; }
.bb-note:focus-within { outline: 3px solid var(--fm-focus); outline-offset: 2px; }
.bb-note.is-need { border-color: var(--fm-warn); }
.bb-note__k { flex: none; white-space: nowrap; font-size: .8125rem; font-weight: 600; color: var(--fm-muted); }
.bb-note__in { flex: 1 1 auto; min-width: 0; font: inherit; color: var(--fm-ink); background: transparent; border: 0; padding: 8px 0; }
.bb-note__in:focus { outline: none; }
.bb-note__in::placeholder { color: var(--fm-muted); opacity: 1; }
.bb-send { flex: none; padding: 0 14px; font-weight: 500; }
.bb-sent { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 12px; font-size: .8125rem; font-weight: 600; color: var(--fm-ok); background: var(--fm-ok-soft); border: 1px solid var(--fm-ok); border-radius: 999px; }
.bb-sent[hidden] { display: none; }
.bb-limit { font-size: .875rem; font-weight: 600; color: var(--fm-warn); }
.bb-limit[hidden] { display: none; }
.bb-item.is-sent .bb-item__title { color: var(--fm-muted); }
.bb-item.is-sent .bb-acts, .bb-item.is-sent .bb-noterow, .bb-item.is-sent .bb-opts, .bb-item.is-sent .bb-cardacts, .bb-item.is-sent .bb-prune { display: none; }
/* decision cards keep native radios with the recommendation already chosen */
.bb-opts { margin-top: 6px; }
.bb-opts .fm-opts__legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.bb-cardacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.bb-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.bb-empty { color: var(--fm-muted); font-size: .9375rem; padding: 4px 0 12px; }
.bb-takeall { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 14px; }
.bb-takeall[hidden], .bb-confirm[hidden] { display: none; }
.bb-takeall > .fm-btn { align-self: flex-start; }
.bb-confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--fm-card); }
.bb-confirm__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .9375rem; }
.bb-confirm__btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* compact rows: Later, Underway, Landed, Queued */
.bb-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--fm-raised); }
.bb-row:first-child { border-top: 0; }
.bb-row__t { font-size: .9375rem; line-height: 1.4; color: var(--fm-ink); overflow-wrap: anywhere; }
.bb-row__r { font-size: .8125rem; text-align: right; }
.bb-row__r a { display: inline-flex; align-items: center; justify-content: flex-end; min-height: 44px; min-width: 44px; margin-block: -12px; font-weight: 600; color: var(--fm-link); }
.bb-row__m { grid-column: 1 / -1; }
.bb-row--pick { grid-template-columns: auto minmax(0, 1fr); cursor: pointer; min-height: 44px; align-items: center; }
.bb-row--pick .bb-row__m { grid-column: 2; }
.bb-pick { width: 20px; height: 20px; margin: 0; accent-color: var(--fm-accent); }
.bb-steps { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; margin-top: 4px; }
.bb-steps__bar { flex: 0 1 120px; height: 6px; border-radius: 999px; background: var(--fm-raised); overflow: hidden; }
.bb-steps__fill { display: block; height: 100%; background: var(--fm-accent); }
.bb-steps__n { font-family: var(--fm-font-mono); font-size: .8125rem; color: var(--fm-muted); }
.bb-h4 { font-size: .8125rem; font-weight: 600; color: var(--fm-muted); margin: 14px 0 2px; }
.bb-h4:first-child { margin-top: 0; }
.bb-sum { font-size: 1rem; color: var(--fm-text); margin-bottom: 8px; }
.bb-sum b { font-family: var(--fm-font-mono); font-weight: 500; color: var(--fm-ink); }
.bb-aside { font-size: .875rem; color: var(--fm-muted); padding-top: 6px; }
.bb-dispatch { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; margin-top: 8px; }
.bb-dispatch[hidden] { display: none; }
.bb-dispatch__count { flex: 1 1 auto; font-size: .875rem; font-weight: 600; color: var(--fm-muted); }
.bb-dispatch .fm-btn[disabled] { opacity: .45; cursor: not-allowed; }
.bb-prune { margin-top: 10px; }
.bb-prune .bb-confirm { margin-bottom: 8px; }
.bb-foot .fm-meta { font-family: var(--fm-font-mono); }
@media (min-width: 720px) {
  .bb-acts { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
}
</style>
</head>
<body>

<main class="fm-page bb-main">

  <header class="fm-mast">
    <h1 class="fm-title">Bearings</h1>
    <p class="fm-sub" id="bb-headline">-</p>
  </header>

  <section class="bb-block" aria-labelledby="bb-inbox-title">
    <h2 class="bb-h2" id="bb-inbox-title">Waiting on you<span class="bb-count" id="bb-inbox-count"></span></h2>
    <div id="bb-inbox"></div>
  </section>

  <section class="bb-block" aria-labelledby="bb-fleet-title">
    <h2 class="bb-h2" id="bb-fleet-title">Fleet</h2>
    <p class="bb-sum" id="bb-fleet-sum"></p>
    <div id="bb-fleet"></div>
  </section>

  <footer class="fm-foot bb-foot">
    <span class="fm-meta" id="bb-provenance">-</span>
  </footer>

</main>

<!-- ONE SLOT. bin/fm-bearings-board.sh build injects the fresh
     fm-bearings-board.v1 payload in place of the placeholder below; everything
     above and below is the shipped template and is never regenerated per run. -->
<script id="bearings-data" type="application/json">
__FM_BEARINGS_BOARD_DATA__
</script>

<script>
(function () {
  "use strict";

  /* Fail closed: a board with unreadable or wrong-schema data says so plainly
     instead of rendering an empty page that looks like an empty fleet. */
  function renderBoardError(msg) {
    var main = document.querySelector(".bb-main");
    main.innerHTML = "";
    var card = document.createElement("article");
    card.className = "fm-decision";
    var h = document.createElement("h2");
    h.className = "fm-decision__title";
    h.textContent = "This board could not load";
    var d = document.createElement("p");
    d.textContent = msg + " - ask firstmate to rebuild the board.";
    card.appendChild(h);
    card.appendChild(d);
    main.appendChild(card);
  }

  var data;
  try {
    data = JSON.parse(document.getElementById("bearings-data").textContent);
  } catch (e) {
    renderBoardError("The board data is not valid JSON");
    return;
  }
  if (!data || data.schema !== "fm-bearings-board.v1") {
    renderBoardError("Unsupported board data schema: " + (data && data.schema ? data.schema : "(none)"));
    return;
  }
  var lists = [data.captains_call, data.inbox, data.later, data.underway, data.landed, data.charted];
  if (!lists.every(Array.isArray)) {
    renderBoardError("The board data does not have the required structure");
    return;
  }

  try {
  var CHEVRON = '<svg class="bb-sec__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  var ANSWER_LIMIT = 512;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function utf8ByteLength(text) { return new TextEncoder().encode(text).length; }
  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }

  /* Dates: payload dates are YYYY-MM-DD; they read in the viewer's own words. */
  function localDay(iso) {
    var p = String(iso).split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12);
  }
  function dayKey(d) {
    function two(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
  }
  function dayWords(iso) {
    return localDay(iso).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
  }
  function shortDay(iso) {
    return localDay(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }
  function whenWords(value) {
    var d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    var time = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).toLowerCase();
    return dayKey(d) === dayKey(new Date()) ? time
      : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + ", " + time;
  }
  var generatedAt = new Date(data.generated);
  var today = dayKey(new Date());
  var windowEnd = new Date(); windowEnd.setDate(windowEnd.getDate() + 7);

  /* A list row shows the full backlog title: a leading [YYYY-MM-DD] tag moves to
     the meta line and an "Arjun:" prefix is dropped. */
  function cleanTitle(title) {
    var t = String(title), tag = "";
    var m = /^\[(\d{4}-\d{2}-\d{2})\]\s*/.exec(t);
    if (m) { tag = m[1]; t = t.slice(m[0].length); }
    t = t.replace(/^Arjun:\s*/, "");
    return { title: t, tag: tag };
  }
  function prNumber(url) { return "PR " + String(url).split("/").pop(); }

  /* Every section folds from its heading and keeps its state per viewer under
     bb-sec:<key>; keys are stable across rebuilds. */
  function section(parent, key, title, count, openByDefault, sub) {
    var d = el("details", "bb-sec" + (sub ? " bb-sec--sub" : ""));
    d.setAttribute("data-sec", key);
    var saved = store(function (ls) { return ls.getItem("bb-sec:" + key); });
    d.open = saved === "1" ? true : saved === "0" ? false : openByDefault;
    var s = el("summary");
    s.appendChild(el(sub ? "span" : "h3", "bb-sec__t", title));
    if (count != null) s.appendChild(el("span", "bb-sec__n", String(count)));
    var chev = el("span", "bb-sec__cw");
    chev.innerHTML = CHEVRON;
    s.appendChild(chev);
    d.appendChild(s);
    var body = el("div", "bb-sec__b");
    d.appendChild(body);
    d.addEventListener("toggle", function () {
      store(function (ls) { ls.setItem("bb-sec:" + key, d.open ? "1" : "0"); });
    });
    parent.appendChild(d);
    return body;
  }

  /* One answer reaches Lavish once. The receipt line is what the Conversation
     panel shows; the versioned context data is what firstmate routes. */
  function queueAnswer(element, receipt, ctxData) {
    ctxData.receipt = receipt;
    var line = receipt.item + " → " + (receipt.action
      ? receipt.action + (receipt.detail ? " · " + receipt.detail : "") + (receipt.note ? " (" + receipt.note + ")" : "")
      : "“" + receipt.note + "”");
    if (window.lavish && window.lavish.queuePrompt) {
      window.lavish.queuePrompt("Bearings board answer - " + line,
        { tag: "choice", text: line, element: element, data: ctxData });
    }
    return line;
  }

  /* One answer per item: once sent, its controls go inert as well as hidden. */
  function markSent(item, pill, text) {
    item.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
    item.classList.add("is-sent");
    pill.textContent = "✓ " + text;
    pill.hidden = false;
  }

  /* The note row every item and card carries. Send note sends the captain's
     words alone; firstmate reads them as an instruction, never as a pick. */
  function noteRow(item, idBase, onSendNote) {
    var row = el("div", "bb-noterow");
    var lab = el("label", "bb-note");
    lab.appendChild(el("span", "bb-note__k", "Note"));
    var input = el("input", "bb-note__in");
    input.type = "text"; input.name = "note"; input.id = idBase + "-note";
    input.placeholder = "optional"; input.autocomplete = "off";
    input.addEventListener("input", function () { lab.classList.remove("is-need"); });
    lab.appendChild(input);
    row.appendChild(lab);
    var send = el("button", "fm-btn bb-send", "Send note");
    send.type = "button";
    send.addEventListener("click", function () {
      if (!input.value.trim()) {
        lab.classList.add("is-need");
        input.focus();
        return;
      }
      onSendNote();
    });
    row.appendChild(send);
    item.appendChild(row);
    return input;
  }
  function limitLine(item) {
    var limit = el("p", "bb-limit", "That answer is too long to queue (512 bytes at most).");
    limit.setAttribute("role", "alert");
    limit.hidden = true;
    item.appendChild(limit);
    return limit;
  }
  function tooLong(limit, parts) {
    var over = parts.some(function (p) { return utf8ByteLength(p) > ANSWER_LIMIT; });
    limit.hidden = !over;
    return over;
  }

  function itemShell(list, key, index, title, ask, meta) {
    var item = el("li", "bb-item");
    item.setAttribute("data-key", key);
    var titleNode = el("h4", "bb-item__title", title);
    titleNode.id = "bb-item-" + index + "-title";
    item.appendChild(titleNode);
    if (ask) item.appendChild(el("p", "bb-item__ask", ask));
    if (meta) item.appendChild(meta);
    list.appendChild(item);
    return item;
  }
  function metaLine(parts, prUrl, link) {
    var m = el("p", "fm-meta bb-item__meta");
    var text = parts.filter(Boolean).join(" · ");
    var links = [];
    if (prUrl) links.push({ url: prUrl, label: prNumber(prUrl) });
    if (link) links.push(link);
    m.appendChild(el("span", null, text + (text && links.length ? " · " : "")));
    links.forEach(function (l, i) {
      if (i) m.appendChild(el("span", null, " · "));
      var a = el("a", null, l.label);
      a.href = l.url; a.title = l.url; a.target = "_blank"; a.rel = "noopener";
      m.appendChild(a);
    });
    return m;
  }

  /* An inbox item: two or three actions written for it, value boxes beside
     the action that reads them, and the note row. */
  var itemIndex = 0;
  function renderInboxItem(list, it) {
    var index = itemIndex++;
    var meta = it.group === "blocking"
      ? metaLine([it.repo, it.since ? "worker waiting since " + whenWords(it.since) : "worker waiting"], it.pr_url)
      : metaLine([it.repo], it.pr_url);
    var item = itemShell(list, it.key, index, it.title, it.ask, meta);
    var inputs = {};
    var placed = {};
    var acts = el("div", "bb-acts");
    acts.setAttribute("role", "group");
    acts.setAttribute("aria-labelledby", "bb-item-" + index + "-title");
    var note;
    var pill = el("p", "bb-sent");
    pill.setAttribute("role", "status");
    pill.hidden = true;
    var limit;

    function field(spec) {
      var f = el("label", "bb-f");
      f.appendChild(el("span", "bb-f__k", spec.label));
      var input = el("input", "fm-input");
      input.type = spec.type; input.name = spec.name; input.autocomplete = "off";
      if (spec.type === "number") { input.inputMode = "decimal"; input.step = "any"; }
      if (spec.default != null) input.value = spec.default;
      input.addEventListener("input", function () { f.classList.remove("is-need"); });
      f.appendChild(input);
      inputs[spec.name] = { spec: spec, input: input, field: f };
      return f;
    }
    function shown(name) {
      var e = inputs[name], v = e.input.value.trim();
      if (e.spec.type === "date" && v) v = shortDay(v);
      if (e.spec.type === "datetime-local" && v) v = whenWords(v);
      return v;
    }

    it.actions.forEach(function (a, ai) {
      var btn = el("button", "bb-act" + (ai === 0 ? " bb-act--main" : ""));
      btn.type = "button";
      btn.setAttribute("data-action", a.value);
      btn.appendChild(el("span", "bb-act__l", a.label));
      btn.appendChild(el("span", "bb-act__h", a.hint));
      var own = a.reads.filter(function (n) { return !placed[n]; });
      if (own.length) {
        var grp = el("div", "bb-actgrp" + (own.length > 1 ? " bb-actgrp--wide" : ""));
        var fields = el("div", "bb-fields" + (own.length >= 3 && own.every(function (n) {
          return it.inputs.some(function (s) { return s.name === n && s.type === "number"; });
        }) ? " bb-fields--counts" : ""));
        own.forEach(function (n) {
          placed[n] = true;
          it.inputs.forEach(function (s) { if (s.name === n) fields.appendChild(field(s)); });
        });
        grp.appendChild(fields);
        grp.appendChild(btn);
        acts.appendChild(grp);
      } else {
        acts.appendChild(btn);
      }
      btn.addEventListener("click", function () {
        var missing = null, values = {}, detail = [];
        a.reads.forEach(function (n) {
          var v = inputs[n].input.value.trim();
          if (!v && !missing) missing = inputs[n];
          values[n] = v;
          if (v) detail.push(a.reads.length > 1 ? inputs[n].spec.label + ": " + shown(n) : shown(n));
        });
        if (missing) {
          missing.field.classList.add("is-need");
          missing.input.focus();
          return;
        }
        var noteText = note.value.trim();
        if (tooLong(limit, [noteText].concat(Object.keys(values).map(function (k) { return values[k]; })))) return;
        var ctx = { schema: "fm-bearings-answer.v1", question: it.key, group: it.group,
          action: a.value, effect: a.effect, values: values, note: noteText };
        if (a.effect === "hold-until") ctx.until = a.until || values[a.reads[0]];
        if (a.effect === "remind-at") ctx.at = a.at || values[a.reads[0]];
        if (a.effect === "dispatch") ctx.brief = a.brief;
        if (a.effect === "close" && it.close) ctx.close = it.close;
        queueAnswer(item, { item: it.title, action: a.label, detail: detail.join(", "), note: noteText }, ctx);
        markSent(item, pill, a.label);
      });
    });
    item.appendChild(acts);
    note = noteRow(item, "bb-item-" + index, function () {
      var noteText = note.value.trim();
      if (tooLong(limit, [noteText])) return;
      queueAnswer(item, { item: it.title, action: "", detail: "", note: noteText },
        { schema: "fm-bearings-answer.v1", question: it.key, group: it.group,
          action: "", values: {}, note: noteText });
      markSent(item, pill, "Your note");
    });
    limit = limitLine(item);
    item.appendChild(pill);
  }

  /* A decision, merge, or credential card in the same item shape: its options
     as native radios with the recommendation already chosen, Send answer, and
     the note row. */
  var cards = [];
  function renderCard(list, card) {
    var index = itemIndex++;
    var meta;
    if (card.type === "merge") {
      meta = metaLine([card.repo, "checks green", "risk " + card.risk], card.pr_url);
    } else {
      meta = metaLine([card.repo, card.type === "credential" ? "needs a login or key" : ""], card.pr_url, card.link);
    }
    var ask = [card.about, card.decide, card.detail].filter(Boolean).join(" ");
    var item = itemShell(list, card.key, index, card.title, ask, meta);
    var pill = el("p", "bb-sent");
    pill.setAttribute("role", "status");
    pill.hidden = true;
    var radios = [];
    var opts = el("fieldset", "fm-opts bb-opts");
    opts.appendChild(el("legend", "fm-opts__legend", "Pick one"));
    card.options.forEach(function (o) {
      var lab = el("label", "fm-opt");
      var input = el("input");
      input.type = "radio"; input.name = "bb-card-" + index; input.value = o.value;
      if (card.recommend_value && o.value === card.recommend_value) input.checked = true;
      radios.push({ input: input, option: o });
      lab.appendChild(input);
      var body = el("span", "fm-opt__body");
      var head = el("span", "fm-opt__head");
      head.appendChild(el("span", "fm-opt__label", o.label));
      if (card.recommend_value && o.value === card.recommend_value) head.appendChild(el("span", "fm-rec", "Recommended"));
      body.appendChild(head);
      if (o.hint) body.appendChild(el("span", "fm-opt__hint", o.hint));
      lab.appendChild(body);
      opts.appendChild(lab);
    });
    if (card.options.length) item.appendChild(opts);
    var note;
    var limit;
    var state = { card: card, item: item, sent: false };
    function send(option) {
      var noteText = note.value.trim();
      if (tooLong(limit, [noteText])) return false;
      var ctx = { schema: "fm-bearings-answer.v1", question: card.key,
        selection: option ? option.value : "", note: noteText };
      if (option && card.close) ctx.close = card.close;
      queueAnswer(item, { item: card.title, action: option ? option.label : "", detail: "", note: noteText }, ctx);
      markSent(item, pill, option ? option.label : "Your note");
      state.sent = true;
      refreshTakeAll();
      return true;
    }
    state.send = send;
    state.recommended = function () {
      var r = radios.filter(function (x) { return x.option.value === card.recommend_value; })[0];
      return r ? r.option : null;
    };
    state.note = function () { return note.value.trim(); };
    if (card.options.length) {
      var cardacts = el("div", "bb-cardacts");
      var btn = el("button", "fm-btn fm-btn--primary", card.type === "merge" ? "Send merge answer" : "Send answer");
      btn.type = "button";
      btn.addEventListener("click", function () {
        var picked = radios.filter(function (x) { return x.input.checked; })[0];
        if (!picked) { if (radios[0]) radios[0].input.focus(); return; }
        send(picked.option);
      });
      cardacts.appendChild(btn);
      item.appendChild(cardacts);
    }
    note = noteRow(item, "bb-item-" + index, function () { send(null); });
    limit = limitLine(item);
    item.appendChild(pill);
    cards.push(state);
  }

  /* Take all recommendations: each open decision card's recommended option as
     its own keyed answer, its typed note riding with it, after a confirm step
     that lists exactly what will be sent. */
  var takeAll = el("div", "bb-takeall");
  var takeBtn = el("button", "fm-btn", "Take all recommendations");
  takeBtn.type = "button";
  var confirmBox = el("div", "bb-confirm");
  confirmBox.hidden = true;
  var confirmList = el("ul", "bb-confirm__list");
  var confirmBtns = el("div", "bb-confirm__btns");
  var confirmSend = el("button", "fm-btn fm-btn--primary", "Send");
  confirmSend.type = "button";
  var confirmCancel = el("button", "fm-btn", "Cancel");
  confirmCancel.type = "button";
  confirmBox.appendChild(el("p", null, "This sends one answer per card:"));
  confirmBox.appendChild(confirmList);
  confirmBtns.appendChild(confirmSend);
  confirmBtns.appendChild(confirmCancel);
  confirmBox.appendChild(confirmBtns);
  takeAll.appendChild(takeBtn);
  takeAll.appendChild(confirmBox);
  function pendingRecommendations() {
    return cards.filter(function (c) { return !c.sent && c.card.type === "decision" && c.recommended(); });
  }
  function refreshTakeAll() {
    var pending = pendingRecommendations();
    takeAll.hidden = pending.length < 2;
    if (pending.length < 2) confirmBox.hidden = true;
    takeBtn.textContent = "Take all " + pending.length + " recommendations";
  }
  takeBtn.addEventListener("click", function () {
    confirmList.textContent = "";
    pendingRecommendations().forEach(function (c) {
      var n = c.note();
      confirmList.appendChild(el("li", null, c.card.title + " → " + c.recommended().label + (n ? " (" + n + ")" : "")));
    });
    confirmBox.hidden = false;
    confirmSend.textContent = "Send " + pendingRecommendations().length + " answers";
  });
  confirmCancel.addEventListener("click", function () { confirmBox.hidden = true; });
  confirmSend.addEventListener("click", function () {
    pendingRecommendations().forEach(function (c) { c.send(c.recommended()); });
    confirmBox.hidden = true;
  });

  /* ---- Waiting on you ---- */
  var inbox = document.getElementById("bb-inbox");
  var blocking = data.inbox.filter(function (i) { return i.group === "blocking"; });
  var due = data.inbox.filter(function (i) { return i.group === "due"; })
    .slice().sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
  var prune = data.prune && Array.isArray(data.prune.candidates) && data.prune.candidates.length ? data.prune : null;
  var waiting = data.inbox.length + data.captains_call.length + (prune ? 1 : 0);
  document.getElementById("bb-inbox-count").textContent = String(waiting);
  document.getElementById("bb-headline").textContent =
    (waiting === 1 ? "1 thing waits on you. " : waiting + " things wait on you. ") +
    (isNaN(generatedAt.getTime()) ? data.generated
      : generatedAt.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) + ", " +
        generatedAt.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).toLowerCase() + ".");

  if (blocking.length) {
    var bl = el("ul", "bb-list");
    blocking.forEach(function (i) { renderInboxItem(bl, i); });
    section(inbox, "blocking", "Blocking a worker", blocking.length, true).appendChild(bl);
  }
  var decisionsBody = section(inbox, "decisions", "Decisions", data.captains_call.length, true);
  if (data.captains_call.length) {
    decisionsBody.appendChild(takeAll);
    var dl = el("ul", "bb-list");
    data.captains_call.forEach(function (c) { renderCard(dl, c); });
    decisionsBody.appendChild(dl);
  } else {
    decisionsBody.appendChild(el("p", "bb-empty", "No open decisions."));
  }
  refreshTakeAll();
  var overdue = due.filter(function (i) { return i.due < today; });
  if (overdue.length) {
    var ol = el("ul", "bb-list");
    overdue.forEach(function (i) { renderInboxItem(ol, i); });
    section(inbox, "overdue", "Overdue", overdue.length, true).appendChild(ol);
  }
  var dueDates = [];
  due.forEach(function (i) { if (i.due >= today && dueDates.indexOf(i.due) < 0) dueDates.push(i.due); });
  dueDates.forEach(function (d) {
    var rows = due.filter(function (i) { return i.due === d; });
    var ul = el("ul", "bb-list");
    rows.forEach(function (i) { renderInboxItem(ul, i); });
    section(inbox, "due-" + d, d === today ? "Due today" : "Due " + dayWords(d), rows.length, true).appendChild(ul);
  });

  /* Weekly prune: one card proposing to drop stale fleet rows. Its three
     answers are fixed here, never composed: drop-all, drop-picked with the
     ticked rows' 1-based positions in the offered list, and keep. */
  function renderPrune(list, p) {
    var index = itemIndex++;
    var n = p.candidates.length;
    var meta = p.more ? metaLine(["+" + p.more + " more held back for next week"], null) : null;
    var item = itemShell(list, p.key || "prune", index, p.title, p.ask, meta);
    var pill = el("p", "bb-sent");
    pill.setAttribute("role", "status");
    pill.hidden = true;
    var note, limit;
    function send(action, label, values, detail) {
      var noteText = note.value.trim();
      var parts = [noteText];
      Object.keys(values).forEach(function (k) { parts.push(values[k]); });
      if (tooLong(limit, parts)) return;
      queueAnswer(item, { item: p.title, action: label, detail: detail, note: noteText },
        { schema: "fm-bearings-answer.v1", question: p.key, group: "prune",
          action: action, effect: "prune", values: values, note: noteText });
      markSent(item, pill, label);
    }

    var acts = el("div", "bb-acts");
    acts.setAttribute("role", "group");
    acts.setAttribute("aria-labelledby", "bb-item-" + index + "-title");
    function act(value, label, hint, main) {
      var b = el("button", "bb-act" + (main ? " bb-act--main" : ""));
      b.type = "button";
      b.setAttribute("data-action", value);
      b.appendChild(el("span", "bb-act__l", label));
      b.appendChild(el("span", "bb-act__h", hint));
      acts.appendChild(b);
      return b;
    }
    var allBtn = act("drop-all", "Drop all " + n, "Closes each one as dropped with a dated note; any can be reopened", true);
    var pickBtn = act("pick", "Let me pick", "Tick the ones to drop below; the rest stay queued", false);
    var keepBtn = act("keep", "Keep them", "Drops nothing and hides this card for a week", false);
    item.appendChild(acts);

    var box = el("div", "bb-prune");
    var confirm = el("div", "bb-confirm");
    confirm.hidden = true;
    confirm.appendChild(el("p", null, "Drop all " + n + "? Each one closes as dropped with a dated note, and any can be reopened."));
    var cBtns = el("div", "bb-confirm__btns");
    var cSend = el("button", "fm-btn fm-btn--primary", "Drop " + n);
    cSend.type = "button";
    var cCancel = el("button", "fm-btn", "Cancel");
    cCancel.type = "button";
    cBtns.appendChild(cSend);
    cBtns.appendChild(cCancel);
    confirm.appendChild(cBtns);
    box.appendChild(confirm);

    var listBody = section(box, "prune-list", "See all " + n, null, false, true);
    var ul = el("ul", "bb-list");
    var picks = [];
    var bar = el("div", "bb-dispatch");
    var count = el("span", "bb-dispatch__count");
    var dropBtn = el("button", "fm-btn fm-btn--primary", "Drop picked");
    dropBtn.type = "button";
    function picked() {
      var at = [];
      picks.forEach(function (c, i) { if (c.checked) at.push(i + 1); });
      return at;
    }
    function refresh() {
      var k = picked().length;
      count.textContent = k ? k + " picked to drop" : "tick the ones to drop";
      dropBtn.textContent = k ? "Drop " + k + " picked" : "Drop picked";
      dropBtn.disabled = !k;
    }
    p.candidates.forEach(function (c) {
      var t = cleanTitle(c.title);
      var row = el("label", "bb-row bb-row--pick");
      var box2 = el("input", "bb-pick");
      box2.type = "checkbox";
      box2.value = c.id;
      box2.setAttribute("aria-label", "Drop " + t.title);
      box2.addEventListener("change", refresh);
      picks.push(box2);
      row.appendChild(box2);
      row.appendChild(el("span", "bb-row__t", t.title));
      var m = [t.tag, c.repo, "last touched " + shortDay(c.touched)].filter(Boolean).join(" · ");
      row.appendChild(el("span", "fm-meta bb-row__m", m));
      var li = el("li");
      li.appendChild(row);
      ul.appendChild(li);
    });
    listBody.appendChild(ul);
    bar.appendChild(count);
    bar.appendChild(dropBtn);
    listBody.appendChild(bar);
    item.appendChild(box);
    refresh();

    allBtn.addEventListener("click", function () { confirm.hidden = false; cSend.focus(); });
    cCancel.addEventListener("click", function () { confirm.hidden = true; });
    cSend.addEventListener("click", function () { send("drop-all", "Drop all " + n, {}, n + " dropped"); });
    pickBtn.addEventListener("click", function () {
      var d = listBody.parentNode;
      d.open = true;
      if (picks[0]) picks[0].focus();
    });
    keepBtn.addEventListener("click", function () { send("keep", "Keep them", {}, ""); });
    dropBtn.addEventListener("click", function () {
      var at = picked();
      if (!at.length) return;
      var names = at.slice(0, 3).map(function (i) { return cleanTitle(p.candidates[i - 1].title).title; });
      send("drop-picked", "Drop " + at.length + " picked", { picked: at.join(",") },
        names.join("; ") + (at.length > 3 ? " +" + (at.length - 3) + " more" : ""));
    });

    note = noteRow(item, "bb-item-" + index, function () {
      var noteText = note.value.trim();
      if (tooLong(limit, [noteText])) return;
      queueAnswer(item, { item: p.title, action: "", detail: "", note: noteText },
        { schema: "fm-bearings-answer.v1", question: p.key, group: "prune",
          action: "", values: {}, note: noteText });
      markSent(item, pill, "Your note");
    });
    limit = limitLine(item);
    item.appendChild(pill);
  }
  if (prune) {
    var pl = el("ul", "bb-list");
    renderPrune(pl, prune);
    section(inbox, "prune", "Weekly prune", prune.candidates.length, true).appendChild(pl);
  }

  /* Later: folded, never on the inbox count */
  function listRow(list, title, metaParts, right) {
    var c = cleanTitle(title);
    var row = el("li", "bb-row");
    row.appendChild(el("span", "bb-row__t", c.title));
    var r = el("span", "bb-row__r");
    if (right) r.appendChild(right);
    row.appendChild(r);
    var parts = metaParts.slice();
    if (c.tag) parts.unshift(c.tag);
    var m = parts.filter(Boolean).join(" · ");
    if (m) row.appendChild(el("span", "fm-meta bb-row__m", m));
    list.appendChild(row);
    return row;
  }
  if (data.later.length) {
    var laterBody = section(inbox, "later", "Later", data.later.length + " · nothing due this week", false);
    [
      { g: "dated", h: "Comes back after " + windowEnd.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) },
      { g: "held", h: "Held for you, no date" },
      { g: "unheld", h: "Filed as yours, never held" }
    ].forEach(function (grp) {
      var rows = data.later.filter(function (r) { return r.group === grp.g; });
      if (grp.g === "dated") rows = rows.slice().sort(function (a, b) { return a.back < b.back ? -1 : a.back > b.back ? 1 : 0; });
      if (!rows.length) return;
      var h = el("h4", "bb-h4", grp.h + " ");
      h.appendChild(el("span", "bb-count", String(rows.length)));
      laterBody.appendChild(h);
      var ul = el("ul", "bb-list");
      rows.forEach(function (r) { listRow(ul, r.title, [r.back ? "back " + shortDay(r.back) : "", r.repo]); });
      laterBody.appendChild(ul);
    });
  }

  /* ---- Fleet ---- */
  var fleet = document.getElementById("bb-fleet");
  function isWarning(t) { return t && t.kind === "warning"; }
  var queued = data.charted.filter(function (t) { return !isWarning(t); });
  var warnings = data.charted.filter(isWarning);
  var queuedTotal = queued.length + (data.charted_more || 0);
  var ready = queued.filter(function (t) { return t.dispatchable; });
  var sum = document.getElementById("bb-fleet-sum");
  [[data.underway.length, " underway · "], [data.landed.length, " landed · "], [queuedTotal, " queued"]].forEach(function (p) {
    sum.appendChild(el("b", null, String(p[0])));
    sum.appendChild(el("span", null, p[1]));
  });

  var uwBody = section(fleet, "underway", "Underway", data.underway.length, true);
  var uw = el("ul", "bb-list");
  if (!data.underway.length) uwBody.appendChild(el("p", "bb-empty", "Nothing is underway."));
  data.underway.forEach(function (t) {
    var row = listRow(uw, t.name, [t.repo, t.doing]);
    if (t.progress && t.progress.total > 0) {
      var steps = el("span", "bb-steps");
      var bar = el("span", "bb-steps__bar");
      var fill = el("span", "bb-steps__fill");
      fill.style.width = Math.round(100 * t.progress.done / t.progress.total) + "%";
      bar.appendChild(fill);
      steps.appendChild(bar);
      steps.appendChild(el("span", "bb-steps__n", t.progress.done + "/" + t.progress.total + (t.progress.step ? " · " + t.progress.step : "")));
      row.appendChild(steps);
    }
  });
  uwBody.appendChild(uw);
  if (blocking.length) {
    uwBody.appendChild(el("p", "bb-aside", blocking.length + " more " + (blocking.length === 1 ? "waits" : "wait") + " on you above."));
  }

  var ldBody = section(fleet, "landed", "Landed recently", data.landed.length, true);
  var ld = el("ul", "bb-list");
  if (!data.landed.length) ldBody.appendChild(el("p", "bb-empty", "No recent completions are in the current baseline."));
  data.landed.forEach(function (t) {
    var link = null;
    if (t.pr_url) {
      link = el("a", null, prNumber(t.pr_url));
      link.href = t.pr_url; link.title = t.pr_url; link.target = "_blank"; link.rel = "noopener";
    }
    listRow(ld, t.outcome, [t.repo, !t.pr_url && t.artifact ? "report" : ""], link);
  });
  ldBody.appendChild(ld);

  var qBody = section(fleet, "queued", "Queued", queuedTotal + " · " + ready.length + " ready", true);
  if (warnings.length || data.charted_warning_more) {
    qBody.appendChild(el("h4", "bb-h4", "Needs repair"));
    var wl = el("ul", "bb-list");
    warnings.forEach(function (t) { listRow(wl, t.title, [t.reason, t.repo]); });
    qBody.appendChild(wl);
    if (data.charted_warning_more) {
      qBody.appendChild(el("p", "bb-aside", "+" + data.charted_warning_more + " more repair warning" +
        (data.charted_warning_more === 1 ? "" : "s") + " - ask firstmate for the full chart"));
    }
  }
  if (!queuedTotal) qBody.appendChild(el("p", "bb-empty", "Nothing is queued."));
  var picks = [];
  var dispatchBar = el("div", "bb-dispatch");
  var dispatchCount = el("span", "bb-dispatch__count", "pick work to start");
  var dispatchBtn = el("button", "fm-btn fm-btn--primary", "Start picked work");
  dispatchBtn.type = "button";
  var dispatchPill = el("p", "bb-sent");
  dispatchPill.setAttribute("role", "status");
  dispatchPill.hidden = true;
  function pickedIds() { return picks.filter(function (p) { return p.checked; }).map(function (p) { return p.value; }); }
  function refreshDispatch(message) {
    var n = pickedIds().length;
    dispatchCount.textContent = message || (n ? n + " picked to start" : "pick work to start");
    dispatchBtn.disabled = !n;
  }
  if (ready.length) {
    qBody.appendChild(el("h4", "bb-h4", "Ready to start now:"));
    var rl = el("ul", "bb-list");
    ready.forEach(function (t) {
      var c = cleanTitle(t.title);
      var row = el("label", "bb-row bb-row--pick");
      var pick = el("input", "bb-pick");
      pick.type = "checkbox"; pick.value = t.id;
      pick.setAttribute("aria-label", "Start " + c.title);
      pick.addEventListener("change", function () {
        if (pick.checked && utf8ByteLength(pickedIds().join(",")) > ANSWER_LIMIT) {
          pick.checked = false;
          refreshDispatch("Selection limit reached (512 bytes at most).");
          return;
        }
        refreshDispatch();
      });
      picks.push(pick);
      row.appendChild(pick);
      row.appendChild(el("span", "bb-row__t", c.title));
      var m = [c.tag, t.repo].filter(Boolean).join(" · ");
      if (m) row.appendChild(el("span", "fm-meta bb-row__m", m));
      var li = el("li");
      li.appendChild(row);
      rl.appendChild(li);
    });
    qBody.appendChild(rl);
    dispatchBar.appendChild(dispatchCount);
    dispatchBar.appendChild(dispatchBtn);
    qBody.appendChild(dispatchBar);
    qBody.appendChild(dispatchPill);
    refreshDispatch();
    dispatchBtn.addEventListener("click", function () {
      var ids = pickedIds();
      if (!ids.length) return;
      var titles = ready.filter(function (t) { return ids.indexOf(t.id) >= 0; })
        .map(function (t) { return cleanTitle(t.title).title; });
      var line = "Start now → " + titles.join("; ");
      if (window.lavish && window.lavish.queuePrompt) {
        window.lavish.queuePrompt("Dispatch order - start this queued work now: " + ids.join(", "),
          { tag: "choice", text: line, element: dispatchBar, queueKey: "dispatch.charted",
            data: { question: "dispatch.charted", answer: ids.join(","),
              receipt: { item: "Start now", action: titles.join("; "), detail: "", note: "" } } });
      }
      dispatchBar.hidden = true;
      dispatchPill.textContent = "✓ " + ids.length + " sent to start";
      dispatchPill.hidden = false;
    });
  }
  var rest = queued.filter(function (t) { return !t.dispatchable; });
  if (rest.length || data.charted_more) {
    var allBody = section(qBody, "queued-all", "Show all " + queuedTotal, null, false, true);
    [
      { w: "date", h: "Waits on a date" },
      { w: "outside", h: "Waits on someone outside" },
      { w: "work", h: "Waits on other work" },
      { w: null, h: "Not started" }
    ].forEach(function (grp) {
      var rows = rest.filter(function (t) {
        return grp.w ? t.wait === grp.w : ["date", "outside", "work"].indexOf(t.wait) < 0;
      });
      if (!rows.length) return;
      var h = el("h4", "bb-h4", grp.h + " ");
      h.appendChild(el("span", "bb-count", String(rows.length)));
      allBody.appendChild(h);
      var ul = el("ul", "bb-list");
      rows.forEach(function (t) {
        var when = t.wait === "date" && t.wait_date
          ? (t.wait_date < today ? "was due " : "from ") + shortDay(t.wait_date) : "";
        listRow(ul, t.title, [when, t.repo]);
      });
      allBody.appendChild(ul);
    });
    if (data.charted_more) {
      allBody.appendChild(el("p", "bb-aside", "+" + data.charted_more + " more queued - ask firstmate for the full chart"));
    }
  }

  document.getElementById("bb-provenance").textContent = data.schema + " · " + data.generated;
  } catch (e) {
    renderBoardError("The board data could not be rendered");
  }
})();
</script>
</body>
</html>
