<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="fleet-html" content="1">
<title>Bearings - fleet board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- The first <style> is the fleet-html house stylesheet, copied verbatim from
     arjmad/skills skills/fleet-html/house.css (commit 55dd688, PR 224) so the
     board stays one self-contained file. Refresh it by pasting that file again;
     board rules live only in the second <style> and read only semantic tokens. -->
<style>
/* fleet-html house.css v1 · C1 airy, navy dark only · source: SOURCE.md */
:root {
  /* primitives: every colour the house uses, by hue; components never read these */
  --fm-navy-950: #121724;
  --fm-navy-900: #1a2133;
  --fm-navy-850: #202a40;
  --fm-navy-750: #2c3650;
  --fm-slate-500: #7a86a3;
  --fm-slate-300: #aab4ca;
  --fm-slate-100: #dde2ec;
  --fm-slate-50: #eef1f7;
  --fm-rust-300: #e69377;
  --fm-rust-950: #3b2a2a;
  --fm-sea-200: #b9d4c5;
  --fm-sea-950: #1d2e2a;
  --fm-gold-200: #f0d38c;
  --fm-gold-950: #362d1c;
  --fm-ocean-200: #b6d4e2;
  --fm-ocean-950: #1b2a38;
  --fm-sky-400: #56b4e9;
  --fm-green-400: #34c19b;
  --fm-purple-400: #cc79a7;
  --fm-violet-400: #9d8cff;

  /* semantic: what components read; the contrast contract checks these */
  --fm-bg: var(--fm-navy-950);
  --fm-card: var(--fm-navy-900);
  --fm-raised: var(--fm-navy-850);
  --fm-ink: var(--fm-slate-50);
  --fm-text: var(--fm-slate-100);
  --fm-muted: var(--fm-slate-300);
  --fm-rule: var(--fm-navy-750);
  --fm-edge: var(--fm-slate-500);
  --fm-accent: var(--fm-rust-300);
  --fm-accent-soft: var(--fm-rust-950);
  --fm-on-accent: var(--fm-navy-950);
  --fm-ok: var(--fm-sea-200);
  --fm-ok-soft: var(--fm-sea-950);
  --fm-warn: var(--fm-gold-200);
  --fm-warn-soft: var(--fm-gold-950);
  --fm-info: var(--fm-ocean-200);
  --fm-info-soft: var(--fm-ocean-950);
  --fm-link: var(--fm-ocean-200);
  --fm-focus: var(--fm-slate-50);
  --fm-shadow-soft: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);

  /* chart series, in this order; checked for contrast and colour-blind separation */
  --fm-chart-1: var(--fm-rust-300);
  --fm-chart-2: var(--fm-sky-400);
  --fm-chart-3: var(--fm-gold-200);
  --fm-chart-4: var(--fm-purple-400);
  --fm-chart-5: var(--fm-green-400);
  --fm-chart-6: var(--fm-violet-400);
  --fm-chart-7: var(--fm-slate-50);

  --fm-font-sans: "Jost", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --fm-font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fm-gutter: max(16px, env(safe-area-inset-left, 0px));
  --fm-gutter-end: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}

/* base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--fm-bg); }
body { margin: 0; background: var(--fm-bg); color: var(--fm-text); font-family: var(--fm-font-sans); font-size: 1rem; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, dl, dd, figure, pre { margin: 0; }
h1, h2, h3 { color: var(--fm-ink); text-wrap: balance; }
p, li, dd, td, th, figcaption { overflow-wrap: anywhere; }
p { max-width: 68ch; }
a { color: var(--fm-link); text-underline-offset: .18em; }
code, pre { font-family: var(--fm-font-mono); font-size: max(.75rem, .875em); }
code { overflow-wrap: anywhere; }
pre { overflow-x: auto; max-width: 100%; padding: 12px 14px; background: var(--fm-card); border-radius: 8px; color: var(--fm-text); }
img, svg, video, canvas { max-width: 100%; height: auto; }
::selection { background: var(--fm-accent); color: var(--fm-on-accent); }
:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible { outline: 3px solid var(--fm-focus); outline-offset: 2px; }

/* page: one reading column, phone gutters, nothing wider than the screen */
.fm-page { max-width: 720px; margin-inline: auto; padding-block: 32px 56px; padding-left: var(--fm-gutter); padding-right: var(--fm-gutter-end); display: flex; flex-direction: column; gap: 32px; }
.fm-page > *, .fm-decision > *, .fm-section > *, .fm-form > * { min-width: 0; }
.fm-mast { display: flex; flex-direction: column; gap: 8px; }
.fm-title { font-size: 1.75rem; font-weight: 500; line-height: 1.15; letter-spacing: -.015em; }
.fm-sub { color: var(--fm-muted); font-size: 1rem; max-width: 48ch; }
.fm-mast--compact .fm-title { font-size: 1.375rem; font-weight: 600; letter-spacing: -.01em; }
.fm-meta { font-size: .8125rem; color: var(--fm-muted); overflow-wrap: anywhere; }

/* stat strip: figures only when the numbers are the point */
.fm-stats { display: flex; flex-wrap: wrap; gap: 18px 28px; }
.fm-stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fm-stat__num { font-family: var(--fm-font-mono); font-variant-numeric: tabular-nums; font-size: 1.75rem; font-weight: 400; line-height: 1; letter-spacing: -.01em; color: var(--fm-ink); }
.fm-stat__label { font-size: .8125rem; color: var(--fm-muted); }
.fm-stat--call .fm-stat__num { color: var(--fm-accent); }

/* badge: plain accent label, or a tinted pill per state */
.fm-badge { display: inline-flex; align-items: center; font-size: .8125rem; font-weight: 600; line-height: 1.3; color: var(--fm-accent); }
.fm-badge--ok, .fm-badge--warn, .fm-badge--info, .fm-badge--accent { border: 1px solid currentColor; border-radius: 999px; padding: 2px 10px; }
.fm-badge--ok { color: var(--fm-ok); background: var(--fm-ok-soft); }
.fm-badge--warn { color: var(--fm-warn); background: var(--fm-warn-soft); }
.fm-badge--info { color: var(--fm-info); background: var(--fm-info-soft); }
.fm-badge--accent { color: var(--fm-accent); background: var(--fm-accent-soft); }

/* decision card: the one boxed thing on a page */
.fm-decision { background: var(--fm-card); border-radius: 14px; box-shadow: var(--fm-shadow-soft); padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.fm-decision__top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; }
.fm-decision__title { font-size: 1.375rem; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
.fm-ctx { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.fm-ctx dt { font-size: .8125rem; font-weight: 600; color: var(--fm-ink); padding-top: 8px; }
.fm-ctx dt:first-of-type { padding-top: 0; }
.fm-ctx dd { color: var(--fm-text); }
.fm-form { display: flex; flex-direction: column; gap: 18px; }

/* option: native radio rows split by a hairline; the checked label turns accent */
.fm-opts { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; }
.fm-opts__legend { font-size: .9375rem; font-weight: 600; color: var(--fm-ink); padding: 0; margin-bottom: 4px; }
.fm-opt { display: flex; align-items: flex-start; gap: 14px; min-height: 44px; padding: 12px 0; border-top: 1px solid var(--fm-rule); cursor: pointer; }
.fm-opt:first-of-type { border-top: 0; }
.fm-opt input { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--fm-accent); }
.fm-opt__body { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
.fm-opt__head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.fm-opt__label { font-size: 1.0625rem; font-weight: 500; line-height: 1.3; color: var(--fm-ink); }
.fm-opt:has(input:checked) .fm-opt__label { color: var(--fm-accent); font-weight: 600; }
.fm-opt__hint { font-size: .9375rem; line-height: 1.4; color: var(--fm-muted); }
.fm-rec { flex: none; font-size: .75rem; font-weight: 600; color: var(--fm-accent); border: 1px solid var(--fm-accent); border-radius: 999px; padding: 2px 9px; }

/* field and buttons */
.fm-field { display: flex; flex-direction: column; gap: 6px; }
.fm-field__label { font-size: .9375rem; font-weight: 600; color: var(--fm-ink); }
.fm-input { width: 100%; min-height: 44px; font: inherit; color: var(--fm-ink); background: var(--fm-card); border: 1px solid var(--fm-edge); border-radius: 8px; padding: 8px 12px; }
textarea.fm-input { min-height: 88px; resize: vertical; }
.fm-input::placeholder { color: var(--fm-muted); opacity: 1; }
.fm-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.fm-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 0 18px; font: inherit; font-weight: 600; border-radius: 8px; border: 1px solid var(--fm-edge); background: transparent; color: var(--fm-ink); cursor: pointer; transition: filter .15s ease, background-color .15s ease; }
.fm-btn:hover { background: var(--fm-raised); }
.fm-btn--primary { background: var(--fm-accent); color: var(--fm-on-accent); border-color: var(--fm-accent); }
.fm-btn--primary:hover { background: var(--fm-accent); filter: brightness(1.08); }
.fm-queued { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; font-size: .8125rem; font-weight: 600; color: var(--fm-ok); background: var(--fm-ok-soft); border: 1px solid var(--fm-ok); border-radius: 999px; }
.fm-queued[hidden] { display: none; }
.fm-ico { width: 1em; height: 1em; flex: none; }

/* report sections, table, today-vs-proposed pair, sources */
.fm-section { display: flex; flex-direction: column; gap: 16px; }
.fm-section h2 { font-size: 1.375rem; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
.fm-section h3 { font-size: 1.125rem; font-weight: 600; line-height: 1.3; }
.fm-section p, .fm-section li { font-size: 1.0625rem; line-height: 1.55; }
.fm-section ul, .fm-section ol { padding-left: 1.25rem; display: flex; flex-direction: column; gap: 6px; max-width: 68ch; }
.fm-figure { display: flex; flex-direction: column; gap: 8px; }
.fm-figure figcaption { font-size: .8125rem; color: var(--fm-muted); }
.fm-tablewrap { overflow-x: auto; max-width: 100%; }
.fm-table { border-collapse: collapse; width: 100%; font-size: .9375rem; font-variant-numeric: tabular-nums; }
.fm-table caption { text-align: left; font-size: .8125rem; color: var(--fm-muted); padding-bottom: 6px; }
.fm-table th, .fm-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--fm-rule); vertical-align: top; }
.fm-table th:first-child, .fm-table td:first-child { padding-left: 0; }
.fm-table thead th { font-size: .8125rem; font-weight: 600; color: var(--fm-muted); }
.fm-table tbody th { font-weight: 500; color: var(--fm-ink); }
.fm-table .num { text-align: right; }
.fm-table td.num { font-family: var(--fm-font-mono); }
.fm-compare { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.fm-compare > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fm-compare__k { font-size: .8125rem; font-weight: 600; color: var(--fm-muted); }
.fm-compare__next .fm-compare__k { color: var(--fm-ok); }
.fm-sources { border-top: 1px solid var(--fm-rule); }
.fm-sources summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--fm-ink); }
.fm-sources ul { margin: 6px 0 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; max-width: 68ch; font-size: .9375rem; color: var(--fm-muted); }
.fm-foot { padding-top: 8px; }

/* one column under 720px; pairs sit side by side above it */
@media (min-width: 720px) {
  .fm-compare { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* paper: dark ink on white, controls hidden */
@media print {
  :root {
    --fm-bg: #ffffff;
    --fm-card: #ffffff;
    --fm-raised: #ffffff;
    --fm-ink: #000000;
    --fm-text: #1a1a1a;
    --fm-muted: #474747;
    --fm-rule: #bdbdbd;
    --fm-edge: #6b6b6b;
    --fm-accent: #8a2f18;
    --fm-accent-soft: #ffffff;
    --fm-on-accent: #ffffff;
    --fm-ok: #1f4a36;
    --fm-ok-soft: #ffffff;
    --fm-warn: #5c3d0c;
    --fm-warn-soft: #ffffff;
    --fm-info: #1d4560;
    --fm-info-soft: #ffffff;
    --fm-link: #1d4560;
    --fm-focus: #000000;
    --fm-shadow-soft: none;
    --fm-chart-1: #a93a1f;
    --fm-chart-2: #0072b2;
    --fm-chart-3: #004d99;
    --fm-chart-4: #a6487b;
    --fm-chart-5: #2f6b4f;
    --fm-chart-6: #6a4fd0;
    --fm-chart-7: #1a2238;
    color-scheme: light;
  }
  .fm-btn, .fm-queued, .fm-field, .fm-actions { display: none !important; }
  .fm-decision, .fm-section, .fm-table tr { break-inside: avoid; }
  .fm-decision { border: 1px solid var(--fm-rule); }
}
</style>
<style>
/* Bearings board rules (bb-*), on the house tokens above. */
.bb-main { max-width: 1180px; }
.bb-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
.bb-cols > * { min-width: 0; }
.bb-section__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
/* the muted subtitle carries runtime text, so it wraps instead of widening a phone page */
.bb-section__head .fm-meta { min-width: 0; line-height: 1.3; overflow-wrap: anywhere; }

/* badge tones the renderer emits, mapped onto the house pills */
.fm-badge--online, .fm-badge--danger, .fm-badge--neutral { border: 1px solid currentColor; border-radius: 999px; padding: 2px 10px; }
.fm-badge--online { color: var(--fm-ok); background: var(--fm-ok-soft); }
.fm-badge--danger { color: var(--fm-accent); background: var(--fm-accent-soft); }
.fm-badge--neutral { color: var(--fm-muted); background: var(--fm-card); }

/* Captain's Call: one card at a time, dealt off a visible stack that thins as
   cards are answered: two edges, then one, then none on the last */
.bb-callwrap { display: flex; flex-direction: column; gap: 12px; }
/* a one-column track that cannot grow to a long link's one-line width */
.bb-call { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); }
.bb-call::before, .bb-call::after {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background: var(--fm-card); border: 1px solid var(--fm-rule); border-radius: 14px;
  box-shadow: var(--fm-shadow-soft);
}
.bb-call::before { transform: translateY(7px) scale(.975); }
.bb-call::after { transform: translateY(14px) scale(.95); }
.bb-call--penult::after { display: none; }
.bb-call--last::before, .bb-call--last::after,
.bb-call--empty::before, .bb-call--empty::after { display: none; }
.bb-call > .bb-decision { grid-area: 1 / 1; z-index: 1; position: relative; }
.bb-call > .bb-decision[hidden] { display: none; }
.bb-decision .fm-form { flex: 1 1 auto; }
.bb-decision .fm-actions { margin-top: auto; }
.bb-decision__detail { color: var(--fm-text); }
.bb-decision__link { display: block; padding-block: 12px; line-height: 20px; font-family: var(--fm-font-mono); font-size: .875rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-queued { display: none; }
.is-queued .bb-queued { display: inline-flex; }
.bb-limit { display: none; font-size: .875rem; font-weight: 600; color: var(--fm-accent); }
.bb-limit.is-visible { display: inline; }
/* extra top margin clears the pile edges that poke below the active card */
.bb-stacknav { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.bb-stacknav[hidden] { display: none; }
.bb-stacknav__count { flex: 1 1 auto; }
.bb-stacknav .fm-btn { width: 44px; padding: 0; }
.bb-stacknav .fm-btn[disabled] { opacity: .45; cursor: not-allowed; }
.bb-stacknav .fm-btn svg { width: 18px; height: 18px; }

/* compact rows (Underway / Landed / Charted), split by hairlines */
.bb-rows { display: flex; flex-direction: column; }
.bb-row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 0; border-top: 1px solid var(--fm-rule); min-width: 0; }
.bb-row:first-child { border-top: 0; }
label.bb-row { cursor: pointer; }
.bb-row__main { min-width: 0; flex: 1 1 auto; }
.bb-row__title { font-weight: 500; color: var(--fm-ink); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-row__sub { font-size: .875rem; color: var(--fm-muted); line-height: 1.35; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-row__pr { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; font-family: var(--fm-font-mono); font-size: .875rem; white-space: nowrap; }
.bb-row__check { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; flex: none;
  color: var(--fm-ok); background: var(--fm-ok-soft); border: 1px solid var(--fm-ok); }
.bb-row__check svg { width: 15px; height: 15px; }
.bb-morechip { display: inline-flex; align-items: center; width: fit-content; margin-top: 12px; padding: 4px 12px;
  font-size: .8125rem; font-weight: 600; color: var(--fm-muted); border: 1px dashed var(--fm-edge); border-radius: 999px; }
.bb-empty { padding: 12px 0; color: var(--fm-muted); }

/* Charted Next dispatch picker: the whole row is the checkbox's label, so the
   target is the row; the spacer keeps one text left edge for unpickable rows */
.bb-pick { flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--fm-accent); cursor: pointer; }
.bb-pick-spacer { width: 20px; flex: none; }
.bb-dispatch { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--fm-rule); }
.bb-dispatch[hidden] { display: none; }
.bb-dispatch__count { flex: 1 1 auto; font-size: .875rem; font-weight: 600; color: var(--fm-muted); }
.bb-dispatch .fm-btn[disabled] { opacity: .45; cursor: not-allowed; }

.bb-foot { border-top: 1px solid var(--fm-rule); padding-top: 14px; }
.bb-foot .fm-meta { font-family: var(--fm-font-mono); }

@media (min-width: 900px) {
  .bb-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<main class="fm-page bb-main">

  <header class="fm-mast">
    <h1 class="fm-title">Bearings</h1>
    <p class="fm-sub">Where the fleet stands, and what waits on you.</p>
  </header>

  <section class="fm-stats" id="bb-stats" aria-label="Counts"></section>

  <div class="bb-cols">
  <section class="fm-section bb-section" aria-labelledby="bb-call-title">
    <div class="bb-section__head">
      <h2 id="bb-call-title">Captain's Call</h2>
      <span class="fm-meta" id="bb-call-sub"></span>
    </div>
    <div class="bb-callwrap">
      <div class="bb-call" id="bb-call"></div>
      <!-- nav sits under the stack so the active card's top edge aligns with
           the Charted Next list across the row -->
      <div class="bb-stacknav">
        <span class="fm-meta bb-stacknav__count" id="bb-stack-count">-</span>
        <button type="button" class="fm-btn" id="bb-stack-prev" aria-label="Previous card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="fm-btn" id="bb-stack-next" aria-label="Next card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="fm-section bb-section" aria-labelledby="bb-charted-title">
    <div class="bb-section__head">
      <h2 id="bb-charted-title">Charted Next</h2>
      <span class="fm-meta" id="bb-charted-sub"></span>
    </div>
    <div>
      <div class="bb-rows" id="bb-charted"></div>
      <div class="bb-dispatch" id="bb-dispatch" hidden>
        <span class="bb-dispatch__count" id="bb-dispatch-count">nothing picked</span>
        <span class="fm-queued bb-queued" id="bb-dispatch-queued">
          <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          Queued
        </span>
        <button type="button" class="fm-btn fm-btn--primary" id="bb-dispatch-btn">Queue dispatch order</button>
      </div>
    </div>
  </section>
  </div>

  <div class="bb-cols">
    <section class="fm-section bb-section" aria-labelledby="bb-underway-title">
      <div class="bb-section__head">
        <h2 id="bb-underway-title">Underway</h2>
      </div>
      <div class="bb-rows" id="bb-underway"></div>
    </section>

    <section class="fm-section bb-section" aria-labelledby="bb-landed-title">
      <div class="bb-section__head">
        <h2 id="bb-landed-title">Recently Landed</h2>
      </div>
      <div class="bb-rows" id="bb-landed"></div>
    </section>
  </div>

  <footer class="fm-foot bb-foot">
    <span class="fm-meta" id="bb-provenance">-</span>
  </footer>

</main>

<!-- ONE SLOT. bin/fm-bearings-board.sh build injects the fresh
     fm-bearings-board.v1 payload in place of the placeholder below; everything
     above and below is the shipped template and is never regenerated per run. -->
<script id="bearings-data" type="application/json">
__FM_BEARINGS_BOARD_DATA__
</script>

<script>
(function () {
  "use strict";

  /* Fail closed: a board with unreadable or wrong-schema data says so plainly
     instead of rendering an empty page that looks like an empty fleet. */
  function renderBoardError(msg) {
    var main = document.querySelector(".bb-main");
    main.innerHTML = "";
    var card = document.createElement("article");
    card.className = "fm-decision bb-decision";
    var h = document.createElement("h2");
    h.className = "fm-decision__title";
    h.textContent = "This board could not load";
    var d = document.createElement("p");
    d.className = "bb-decision__detail";
    d.textContent = msg + " - ask firstmate to rebuild the board.";
    card.appendChild(h);
    card.appendChild(d);
    main.appendChild(card);
  }

  var data;
  try {
    data = JSON.parse(document.getElementById("bearings-data").textContent);
  } catch (e) {
    renderBoardError("The board data is not valid JSON");
    return;
  }
  if (!data || data.schema !== "fm-bearings-board.v1") {
    renderBoardError("Unsupported board data schema: " + (data && data.schema ? data.schema : "(none)"));
    return;
  }
  var fleetLists = [data.captains_call, data.underway, data.landed, data.charted];
  var callItemsValid = Array.isArray(data.captains_call) && data.captains_call.every(function (item) {
    return item && typeof item === "object" &&
      typeof item.key === "string" && item.key.length > 0 &&
      typeof item.type === "string" && item.type.length > 0 &&
      typeof item.title === "string" && item.title.length > 0 &&
      Array.isArray(item.options);
  });
  if (!fleetLists.every(Array.isArray) || !callItemsValid) {
    renderBoardError("The board data does not have the required structure");
    return;
  }

  try {
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function badge(tone, text) { return el("span", "fm-badge fm-badge--" + tone, text); }
  /* Warnings ride the charted feed for layout only; they are alarms, not work,
     so every count of queued work excludes them. */
  function isWarning(t) { return t && t.kind === "warning"; }
  function chartedQueued(rows) { return (rows || []).filter(function (t) { return !isWarning(t); }); }
  /* Charted Next reads newest filed first, so the most recently filed upcoming
     work is at the top. ISO filed dates compare as text; a row with no
     comparable date keeps its payload order after every dated row. */
  function chartedOrder(rows) {
    var dated = [], undated = [];
    (rows || []).forEach(function (t) {
      if (t && typeof t.filed === "string" && t.filed) dated.push(t); else undated.push(t);
    });
    dated.sort(function (a, b) { return a.filed < b.filed ? 1 : (a.filed > b.filed ? -1 : 0); });
    return dated.concat(undated);
  }
  var chartedMoreQueued = data.charted_more || 0;
  var chartedMoreWarnings = data.charted_warning_more || 0;
  function utf8ByteLength(text) { return new TextEncoder().encode(text).length; }
  var CHECK_SVG = '<svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  document.getElementById("bb-provenance").textContent = data.schema + " · " + data.generated;

  /* stat strip */
  var callTotal = data.captains_call.length;
  var stats = [
    { n: callTotal, l: "need you", call: true },
    { n: data.underway.length, l: "underway" },
    { n: data.landed.length, l: "landed recently" },
    { n: chartedQueued(data.charted).length + chartedMoreQueued, l: "charted next" }
  ];
  var strip = document.getElementById("bb-stats");
  stats.forEach(function (s) {
    var t = el("div", "fm-stat bb-stat" + (s.call ? " fm-stat--call" : ""));
    t.appendChild(el("span", "fm-stat__num bb-stat__num", String(s.n)));
    t.appendChild(el("span", "fm-stat__label bb-stat__label", s.l));
    strip.appendChild(t);
  });
  document.getElementById("bb-call-sub").textContent =
    callTotal ? callTotal + " item" + (callTotal === 1 ? "" : "s") + " wait on you, captain" : "nothing needs you, captain";

  /* Captain's Call deck: every item renders as the same full card */
  var deck = document.getElementById("bb-call");
  function ctxRow(ctx, k, v) {
    ctx.appendChild(el("dt", null, k));
    ctx.appendChild(el("dd", null, v));
  }

  data.captains_call.forEach(function (item, index) {
    var card = el("article", "fm-decision bb-decision");
    var titleId = "bb-call-" + index + "-title";
    card.setAttribute("aria-labelledby", titleId);

    var top = el("div", "fm-decision__top");
    if (item.type === "merge") {
      top.appendChild(badge("online", "checks green"));
      top.appendChild(badge(item.risk === "low" ? "neutral" : "warn", "risk " + item.risk));
    } else {
      top.appendChild(badge("solid", "decision"));
      top.appendChild(el("span", "fm-meta", item.repo));
    }
    card.appendChild(top);

    var title = el("h3", "fm-decision__title", item.title);
    title.id = titleId;
    card.appendChild(title);

    if (item.type === "merge") {
      if (item.detail) card.appendChild(el("p", "bb-decision__detail", item.detail));
      if (item.pr_url) {
        var pr = el("a", "bb-decision__link", item.pr_url);
        pr.href = item.pr_url; pr.target = "_blank"; pr.rel = "noopener";
        card.appendChild(pr);
      }
    } else {
      /* the Recommended tag on the option itself carries the recommendation */
      var ctx = el("dl", "fm-ctx");
      if (item.about) ctxRow(ctx, "About", item.about);
      if (item.decide) ctxRow(ctx, "Decide", item.decide);
      card.appendChild(ctx);
    }

    var form = el("form", "fm-form");
    form.setAttribute("data-lavish-question", item.key);
    var opts = el("fieldset", "fm-opts");
    opts.appendChild(el("legend", "fm-opts__legend", "Pick one"));
    item.options.forEach(function (o) {
      var lab = el("label", "fm-opt");
      var input = document.createElement("input");
      input.type = "radio"; input.name = "answer"; input.value = o.value;
      lab.appendChild(input);
      var body = el("span", "fm-opt__body");
      var head = el("span", "fm-opt__head");
      head.appendChild(el("span", "fm-opt__label", o.label));
      if (item.recommend_value && o.value === item.recommend_value) {
        head.appendChild(el("span", "fm-rec", "Recommended"));
      }
      body.appendChild(head);
      if (o.hint) body.appendChild(el("span", "fm-opt__hint", o.hint));
      lab.appendChild(body);
      opts.appendChild(lab);
    });
    form.appendChild(opts);

    if (item.allow_freeform) {
      var field = el("div", "fm-field");
      var noteId = "bb-call-" + index + "-note";
      var noteLabel = el("label", "fm-field__label", "Or answer in your own words");
      noteLabel.setAttribute("for", noteId);
      field.appendChild(noteLabel);
      var ff = document.createElement("input");
      ff.type = "text"; ff.name = "note"; ff.className = "fm-input"; ff.id = noteId;
      ff.placeholder = item.freeform_hint || "Optional";
      field.appendChild(ff);
      form.appendChild(field);
    }

    var foot = el("div", "fm-actions");
    var btn = el("button", "fm-btn fm-btn--primary", "Queue answer");
    btn.type = "submit";
    foot.appendChild(btn);
    var q = el("span", "fm-queued bb-queued");
    q.innerHTML = CHECK_SVG + "Queued";
    foot.appendChild(q);
    var answerLimit = el("span", "bb-limit");
    answerLimit.setAttribute("role", "alert");
    foot.appendChild(answerLimit);
    form.appendChild(foot);

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      answerLimit.classList.remove("is-visible");
      var fd = new FormData(form);
      var value = fd.get("answer");
      var note = (fd.get("note") || "").trim();
      var displayAnswer = value ? (note ? value + " - " + note : value) : note;
      if (!displayAnswer) return;
      if (utf8ByteLength(displayAnswer) > 512) {
        answerLimit.textContent = "Answer is too long to queue (512 bytes maximum).";
        answerLimit.classList.add("is-visible");
        return;
      }
      if (window.lavish && window.lavish.queuePrompt) {
        /* The versioned context keeps the selected option separate from its
           note, while close carries the composer-declared completion mode. */
        var ctxData = {
          schema: "fm-bearings-answer.v1",
          question: item.key,
          selection: value || "",
          note: note
        };
        if (item.close) ctxData.close = item.close;
        window.lavish.queuePrompt(
          "Captain's Call answer - " + item.title + ": " + displayAnswer,
          { tag: "choice", text: item.title + " -> " + displayAnswer, element: form,
            data: ctxData }
        );
      }
      card.classList.add("is-queued");
      /* deal the next card once this one is answered */
      setTimeout(function () { showCard(active < cards.length - 1 ? active + 1 : active); }, 450);
    });

    card.appendChild(form);
    deck.appendChild(card);
  });

  /* stack navigation: one card at a time, dealt off the pile */
  var cards = Array.prototype.slice.call(deck.children);
  var active = 0;
  var stackCount = document.getElementById("bb-stack-count");
  var stackPrev = document.getElementById("bb-stack-prev");
  var stackNext = document.getElementById("bb-stack-next");
  var stackNav = stackCount.parentNode;
  function showCard(i) {
    active = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach(function (c, j) { c.hidden = j !== active; });
    var answered = deck.querySelectorAll(".is-queued").length;
    stackCount.textContent = "card " + (active + 1) + " of " + cards.length +
      (answered ? " · " + answered + " answered" : "");
    stackPrev.disabled = active === 0;
    stackNext.disabled = active === cards.length - 1;
    /* the pile thins as the deal approaches the bottom */
    deck.classList.toggle("bb-call--penult", active === cards.length - 2);
    deck.classList.toggle("bb-call--last", active === cards.length - 1);
  }
  if (cards.length) {
    stackPrev.addEventListener("click", function () { showCard(active - 1); });
    stackNext.addEventListener("click", function () { showCard(active + 1); });
    showCard(0);
  } else {
    deck.classList.add("bb-call--empty");
    deck.appendChild(el("div", "bb-empty", "Nothing needs your action right now."));
    stackNav.hidden = true;
  }

  /* Underway */
  var uw = document.getElementById("bb-underway");
  if (!data.underway.length) uw.appendChild(el("div", "bb-empty", "Nothing is underway."));
  data.underway.forEach(function (t) {
    var row = el("div", "bb-row");
    row.appendChild(badge(t.state === "working" ? "online" : "info", t.state));
    var main = el("div", "bb-row__main");
    /* the snapshot's durable name-or-id label leads the row so a scan says
       WHICH task this is; the run status keeps its place on the second line */
    main.appendChild(el("div", "bb-row__title", t.name));
    /* captain-facing rows name the repo; the internal task id shows only when
       no repo is known */
    main.appendChild(el("div", "bb-row__sub",
      t.doing + " · " + t.kind + " · " + (t.repo || t.id)));
    row.appendChild(main);
    uw.appendChild(row);
  });

  /* Landed */
  var ld = document.getElementById("bb-landed");
  if (!data.landed.length) ld.appendChild(el("div", "bb-empty", "No recent completions are in the current baseline."));
  data.landed.forEach(function (t) {
    var row = el("div", "bb-row");
    var chk = el("span", "bb-row__check");
    chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
    row.appendChild(chk);
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.what));
    main.appendChild(el("div", "bb-row__sub", (t.repo || t.id) + " · " + t.owner));
    row.appendChild(main);
    if (t.pr_url) {
      var a = el("a", "bb-row__pr", "#" + t.pr_url.split("/").pop());
      a.href = t.pr_url; a.title = t.pr_url; a.target = "_blank"; a.rel = "noopener";
      row.appendChild(a);
    }
    ld.appendChild(row);
  });

  /* Charted Next + dispatch picker */
  var ch = document.getElementById("bb-charted");
  var bar = document.getElementById("bb-dispatch");
  var barCount = document.getElementById("bb-dispatch-count");
  var barBtn = document.getElementById("bb-dispatch-btn");
  var anyPickable = false;

  function pickedIds() {
    return Array.prototype.map.call(ch.querySelectorAll(".bb-pick:checked"), function (c) { return c.value; });
  }
  function refreshBar(limitMessage) {
    var n = pickedIds().length;
    barCount.textContent = limitMessage || (n ? n + " picked for dispatch" : "pick queued work to dispatch");
    barBtn.disabled = !n;
  }

  if (!chartedQueued(data.charted).length && !chartedMoreQueued) {
    ch.appendChild(el("div", "bb-empty", "Nothing is queued."));
  }
  chartedOrder(data.charted).forEach(function (t) {
    var pickable = t.dispatchable && !isWarning(t);
    /* a pickable row is the checkbox's label, so the whole row is its target */
    var row = el(pickable ? "label" : "div", "bb-row");
    if (pickable) {
      anyPickable = true;
      var pick = document.createElement("input");
      pick.type = "checkbox"; pick.className = "bb-pick"; pick.value = t.id;
      pick.setAttribute("aria-label", "Pick " + t.id + " for dispatch");
      pick.addEventListener("change", function () {
        if (pick.checked && utf8ByteLength(pickedIds().join(",")) > 512) {
          pick.checked = false;
          refreshBar("Selection limit reached (512 bytes maximum). ");
          return;
        }
        refreshBar();
      });
      row.appendChild(pick);
    } else {
      row.appendChild(el("span", "bb-pick-spacer"));
    }
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.title));
    /* second line keeps the title uncrowded in the half-width column */
    var chSub = t.repo || t.id;
    main.appendChild(el("div", "bb-row__sub", t.reason ? t.reason + " · " + chSub : chSub));
    row.appendChild(main);
    if (isWarning(t)) row.appendChild(badge("danger", "needs repair"));
    else if (t.reason) row.appendChild(badge("warn", "waiting"));
    ch.appendChild(row);
  });
  var chartedShown = chartedQueued(data.charted).length;
  var chartedTotal = chartedShown + chartedMoreQueued;
  document.getElementById("bb-charted-sub").textContent =
    chartedMoreQueued ? "showing " + chartedShown + " of " + chartedTotal : "";
  if (chartedMoreQueued) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreQueued + " more queued - ask firstmate for the full chart"));
  }
  if (chartedMoreWarnings) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreWarnings + " more repair warning" + (chartedMoreWarnings === 1 ? "" : "s") + " - ask firstmate for the full chart"));
  }

  if (anyPickable) {
    bar.hidden = false;
    refreshBar();
    barBtn.addEventListener("click", function () {
      var ids = pickedIds();
      var dispatchAnswer = ids.join(",");
      if (!ids.length) return;
      if (utf8ByteLength(dispatchAnswer) > 512) {
        refreshBar("Selection is too long to queue (512 bytes maximum). ");
        return;
      }
      if (window.lavish && window.lavish.queuePrompt) {
        window.lavish.queuePrompt(
          "Dispatch order - start this queued work now: " + ids.join(", "),
          { tag: "choice", text: "Dispatch: " + ids.join(", "), element: bar,
            queueKey: "dispatch.charted",
            data: { question: "dispatch.charted", answer: dispatchAnswer } }
        );
      }
      bar.classList.add("is-queued");
    });
  }
  } catch (e) {
    renderBoardError("The board data could not be rendered");
  }
})();
</script>
</body>
</html>
