name: Require no-mistakes

on:
  # The gate reads only `github.event.pull_request.body`, which a push cannot
  # change, so a `synchronize` run can never reach a different verdict than the
  # `opened`/`edited` run before it. Requesting a hosted runner per pushed round
  # anyway only adds ways for the gate to report failure without ever evaluating
  # the signature (a denied runner reports "failure" with zero steps, which reads
  # as "this contributor bypassed no-mistakes"). Stay on the events that can
  # actually change the body; no-mistakes rewrites the body after each push, so
  # the `edited` run still lands on that round's final head commit.
  pull_request:
    types: [opened, edited, reopened]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Verify no-mistakes signature in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          if printf '%s' "${PR_BODY:-}" | grep -qF -- "$marker"; then
            echo "Found no-mistakes signature in PR #${PR_NUMBER} body."
            exit 0
          fi
          {
            echo "::error::This PR was not raised through no-mistakes."
            echo
            echo "Contributions to this repository must be submitted via 'git push no-mistakes'."
            echo "That pipeline runs the required review/test/lint/CI steps and writes a"
            echo "deterministic '## Pipeline' section into the PR body containing:"
            echo
            echo "    $marker"
            echo
            echo "See CONTRIBUTING.md for setup and the full workflow."
            echo
            echo "PR author: ${PR_AUTHOR}"
          } >&2
          exit 1
